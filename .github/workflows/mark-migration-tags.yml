name: Mark original lab commits once

on:
  push:
    branches: [main]
    paths: [.github/workflows/mark-migration-tags.yml]

permissions:
  contents: read

jobs:
  mark:
    if: github.repository == 'ieuforu/frontend-labs' && github.event_name == 'push' && github.run_number == 1 && github.event.before == '6744f7e5666280a46140b59dedbb58c3ca8a0f20'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add the three original-history tags without changing any branch
        run: |
          set -eu
          git merge-base --is-ancestor e55fd497a997aba0c65525de39c2ffb37738cde4 HEAD
          git merge-base --is-ancestor 8d8b74e3f603a1e23d5ee42877825195d118ec10 HEAD
          git merge-base --is-ancestor d7d07b8de32c20b7a1eb3ddc405bfcab731d4d23 HEAD
          git tag migration/task-slicer-lab e55fd497a997aba0c65525de39c2ffb37738cde4
          git tag migration/thread-pool-lab 8d8b74e3f603a1e23d5ee42877825195d118ec10
          git tag migration/virtual-list-lab d7d07b8de32c20b7a1eb3ddc405bfcab731d4d23
          git push --atomic origin refs/tags/migration/task-slicer-lab refs/tags/migration/thread-pool-lab refs/tags/migration/virtual-list-lab
