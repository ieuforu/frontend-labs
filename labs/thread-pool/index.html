<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thread Pool & SharedArrayBuffer Lab</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        background: #0f172a;
        color: #f8fafc;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 40px 20px;
        gap: 20px;
      }
      .panel {
        background: #1e293b;
        border: 1px solid #334155;
        border-radius: 8px;
        padding: 24px;
        width: 100%;
        max-width: 680px;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      .monitor-box {
        display: flex;
        align-items: center;
        gap: 20px;
        background: #0f172a;
        padding: 16px;
        border-radius: 6px;
        border: 1px solid #334155;
      }
      .fps-text {
        font-size: 24px;
        font-weight: bold;
        color: #38bdf8;
      }
      .btn-grid {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 12px;
      }
      button {
        padding: 14px 10px;
        border: none;
        border-radius: 6px;
        font-weight: 600;
        font-size: 13px;
        cursor: pointer;
        transition: opacity 0.2s;
      }
      button:active {
        opacity: 0.8;
      }
      button:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
      .btn-block {
        background: #ef4444;
        color: white;
      }
      .btn-slice {
        background: #eab308;
        color: #0f172a;
      }
      .btn-worker {
        background: #10b981;
        color: white;
      }
      input {
        width: 100%;
        padding: 12px;
        background: #0f172a;
        border: 1px solid #475569;
        border-radius: 6px;
        color: #f8fafc;
        font-size: 14px;
      }
      .progress-bar-bg {
        width: 100%;
        height: 14px;
        background: #0f172a;
        border-radius: 7px;
        overflow: hidden;
      }
      .progress-bar-fill {
        height: 100%;
        width: 0%;
        background: #38bdf8;
        transition: width 0.05s linear;
      }
      #status {
        font-size: 14px;
        color: #38bdf8;
      }
      #log {
        font-size: 12px;
        color: #94a3b8;
        white-space: pre-wrap;
        max-height: 200px;
        overflow-y: auto;
        background: #0f172a;
        padding: 12px;
        border-radius: 6px;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <div class="panel">
      <h2>主线程实时状态探测仪</h2>
      <div class="monitor-box">
        <canvas id="raf-spinner" width="48" height="48"></canvas>
        <div>
          <div class="fps-text" id="fps-val">-- FPS</div>
          <div id="isolation-status" style="font-size: 12px; color: #94a3b8">环境检测中...</div>
        </div>
      </div>

      <div>
        <label style="display: block; margin-bottom: 6px; font-size: 13px"
          >实时交互测试（高负载运行时敲击键盘）：</label
        >
        <input type="text" placeholder="主线程被卡死时此处将彻底锁死无法输入..." />
      </div>
    </div>

    <div class="panel">
      <h2>架构性能三方对比实验 (300,000 计算单元)</h2>
      <div class="btn-grid">
        <button id="btn-block" class="btn-block">1. 单线程同步阻塞</button>
        <button id="btn-slice" class="btn-slice">2. 协作式切片调度</button>
        <button id="btn-worker" class="btn-worker">3. SAB 多核并行计算</button>
      </div>

      <div class="progress-bar-bg">
        <div id="progress" class="progress-bar-fill"></div>
      </div>
      <div id="status">就绪 (等待选择运行方案)</div>
      <div id="log"></div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
